# Builds the site on every push to master and publishes the built files to the
# `hostinger` branch. Hostinger's Git deployment pulls that branch into public_html
# (Hostinger only copies files; it does not run `npm run build` itself).
name: Build for Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` also runs the prerender step (postbuild) with Puppeteer
      - run: npm run build

      - name: Publish dist/ to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Build for Hostinger"
